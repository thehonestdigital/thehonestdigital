  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState } = React;

      function Hero() {
        return (
          <section className="section" style={{ paddingTop: 32, paddingBottom: 96 }}>
            <div className="container relative" style={{ display: 'grid', gridTemplateColumns: '1.5fr 1fr', alignItems: 'center', gap: 56 }}>
              <div>
                <div className="eyebrow" style={{ marginBottom: 26 }}>A membership &amp; community for musicians</div>
                <h1 className="display h-xl">
                  Marketing advice,<br /><span className="italic">straight</span> with you.
                </h1>
                <p className="lead" style={{ marginTop: 30, maxWidth: 560 }}>
                  You make the music. I&rsquo;ll help you build the whole digital foundation around it, socials, website, email, text, and analytics, told direct and truthful with no jargon and no fluff.
                </p>
                <div style={{ display: 'flex', gap: 14, alignItems: 'center', marginTop: 38, flexWrap: 'wrap' }}>
                  <a href="https://https://www.skool.com/honest-digital-for-artists-2113/about" target="_blank" rel="noopener" className="btn btn-clay btn-lg">Join for $37/month →</a>
                  <a href="about.html" className="btn btn-ghost btn-lg">Why &ldquo;honest&rdquo;?</a>

              </div>
              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <DandelionO size={1.6} variant="classic" puffStyle="brush" withSeeds={true} seedCount={6} />
              </div>
            </div>
          </section>
        );
      }

      function Marquee() {
        const items = ['no jargon', 'no fluff', 'straight answers', 'what actually works', 'plain steps', 'the real why', 'no jargon', 'no fluff', 'straight answers', 'what actually works', 'plain steps', 'the real why'];
        return (
          <div style={{ borderTop: '1px solid var(--line)', borderBottom: '1px solid var(--line)', overflow: 'hidden', padding: '20px 0', position: 'relative', zIndex: 1, background: 'var(--cream)' }}>
            <div className="marquee-track">
              {items.concat(items).map((t, i) => (
                <span key={i} style={{ display: 'inline-flex', alignItems: 'center', gap: 22, marginRight: 22, fontFamily: 'Times New Roman, serif', fontStyle: 'italic', fontSize: 26 }}>
                  {t}
                  <span aria-hidden style={{ display: 'inline-flex', color: ['var(--clay)', 'var(--sage)', 'var(--marigold)', 'var(--sky)'][i % 4] }}>
                    <DandelionO size={0.1} variant="classic" puffStyle="brush" withSeeds={false} whole={true} />
                  </span>
                </span>
              ))}
            </div>
          </div>
        );
      }

      // The problem → the promise
      function Promise_() {
        const rows = [
          ['You can write, play, sing, or produce.', 'But every marketing guide buries the useful part under buzzwords and filler.'],
          ['So you read ten threads and act on none.', 'Because none of them just told you, plainly, what to do next.'],
          ['And the foundation never gets set.', 'The socials sputter, the list stays empty, the music stays quiet.'],
        ];
        return (
          <section className="section" style={{ paddingTop: 110, paddingBottom: 30 }}>
            <div className="container relative">
              <SectionHeader eyebrow="Sound familiar?" title={<>Plenty of advice. <span className="italic">None</span> of it straight.</>} />
              <div style={{ marginTop: 56, display: 'grid', gridTemplateColumns: '1fr', gap: 0 }}>
                {rows.map(([a, b], i) => (
                  <Reveal key={i} delay={i * 80}>
                    <div className="problem-row" style={{ display: 'grid', gridTemplateColumns: '60px 1fr 1fr', gap: 28, alignItems: 'baseline', padding: '28px 0', borderTop: '1px solid var(--line)' }}>
                      <span className="eyebrow">{String(i + 1).padStart(2, '0')}</span>
                      <h3 style={{ margin: 0, fontWeight: 700, fontSize: 'clamp(22px, 2.4vw, 30px)', letterSpacing: '-0.01em', lineHeight: 1.15 }} dangerouslySetInnerHTML={{ __html: a }} />
                      <p className="italic" style={{ margin: 0, fontSize: 19, color: 'var(--warm-grey)', lineHeight: 1.5 }} dangerouslySetInnerHTML={{ __html: b }} />
                    </div>
                  </Reveal>
                ))}
              </div>
            </div>
          </section>
        );
      }

      // The full digital foundation — across every platform, not just one
      const FOUNDATION = [
        { c: 'var(--clay)', t: 'Socials', b: 'All of them working together, not one burnout platform. A plan you can actually keep up with.' },
        { c: 'var(--sage)', t: 'Website', b: 'A simple site you own and control, built to turn listeners into fans and fans into buyers.' },
        { c: 'var(--marigold)', t: 'Email', b: 'A list that&rsquo;s yours for good, and emails people are genuinely glad to open.' },
        { c: 'var(--sky)', t: 'Text', b: 'The most direct line to your people, used with care so it never feels like spam.' },
        { c: 'var(--plum)', t: 'Data &amp; analytics', b: 'Know what&rsquo;s working and what isn&rsquo;t, in plain numbers, so you stop guessing.' },
        { c: 'var(--ink)', t: 'The foundation', b: 'How it all fits together into one calm system, set up right from the start.' },
      ];
      function Foundation() {
        return (
          <section className="section" style={{ paddingTop: 100, paddingBottom: 100 }}>
            <div className="container relative">
              <SectionHeader eyebrow="The whole picture" title={<>Get your <span className="italic">whole</span> digital foundation right.</>} />
              <p className="lead" style={{ marginTop: 20, maxWidth: 640 }}>
                Not one platform, all of them. We focus on the foundation so every piece points the same direction.
              </p>
              <div style={{ marginTop: 56, display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 0, borderTop: '1px solid var(--line-strong)' }} className="ways-grid">
                {FOUNDATION.map((f, i) => (
                  <Reveal key={i} delay={(i % 3) * 70}>
                    <div style={{ borderBottom: '1px solid var(--line-strong)', borderRight: (i % 3 !== 2) ? '1px solid var(--line)' : 'none', padding: '30px 28px 36px', height: '100%' }}>
                      <span className="swatch" style={{ width: 40, height: 40, background: f.c, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: f.c === 'var(--ink)' ? 'var(--cream)' : 'rgba(20,17,14,0.85)', marginBottom: 18 }}>
                        <DandelionO size={0.12} variant="classic" puffStyle="brush" withSeeds={false} whole={true} />
                      </span>
                      <h3 style={{ margin: 0, fontWeight: 700, fontSize: 24, letterSpacing: '-0.01em' }} dangerouslySetInnerHTML={{ __html: f.t }} />
                      <p style={{ margin: '12px 0 0', fontSize: 15, lineHeight: 1.6, color: 'var(--warm-grey)' }} dangerouslySetInnerHTML={{ __html: f.b }} />
                    </div>
                  </Reveal>
                ))}
              </div>
            </div>
          </section>
        );
      }

      // What's inside the membership
      const PILLARS = [
        { c: 'var(--clay)', t: 'New courses every month', b: 'A fresh, do-it-this-month course drops monthly, each one straight to the point with the exact steps to follow.' },
        { c: 'var(--sage)', t: 'Live monthly workshops', b: 'Monthly live sessions where we work through a piece of your foundation together, step by step.' },
        { c: 'var(--marigold)', t: 'Plug-and-play templates', b: 'Ready-made starting points for the pieces you keep putting off, so you begin from something instead of a blank page.' },
        { c: 'var(--sky)', t: 'A community of musicians', b: 'A generous room of artists sharing what&rsquo;s actually working right now, so you&rsquo;re never figuring it out alone.' },
      ];
      function Pillars() {
        return (
          <section className="section" style={{ paddingTop: 30, paddingBottom: 100 }}>
            <div className="container relative">
              <SectionHeader eyebrow="What&rsquo;s inside" title={<>One membership. <span className="italic">Everything</span> you keep meaning to do.</>} cta="See the full list →" ctaHref="join.html" />
              <div style={{ marginTop: 60, display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: 24 }} className="pillars-grid">
                {PILLARS.map((p, i) => (
                  <Reveal key={i} delay={i * 70}>
                    <article className="card" style={{ padding: 36, height: '100%', display: 'flex', flexDirection: 'column', gap: 16 }}>
                      <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
                        <span className="swatch" style={{ width: 44, height: 44, background: p.c, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', color: 'rgba(20,17,14,0.85)', flexShrink: 0 }}>
                          <DandelionO size={0.14} variant="classic" puffStyle="brush" withSeeds={false} whole={true} />
                        </span>
                        <h3 style={{ margin: 0, fontWeight: 700, fontSize: 24, letterSpacing: '-0.01em' }} dangerouslySetInnerHTML={{ __html: p.t }} />
                      </div>
                      <p style={{ margin: 0, fontSize: 16, lineHeight: 1.6, color: 'var(--warm-grey)' }} dangerouslySetInnerHTML={{ __html: p.b }} />
                    </article>
                  </Reveal>
                ))}
              </div>
            </div>
          </section>
        );
      }

      // Community band (dark) — it's not just a course
      function Community() {
        const points = [
          ['Learn what&rsquo;s working now', 'Real tactics from musicians in the trenches this week, not recycled advice from years ago.'],
          ['Share the wins and the stuck', 'Post a draft, ask the dumb question, celebrate the small breakthroughs. Nobody&rsquo;s judging.'],
          ['Never market alone again', 'Doing it yourself doesn&rsquo;t mean doing it by yourself. The room is generous and quiet on purpose.'],
        ];
        return (
          <section className="section" style={{ background: 'var(--ink)', color: 'var(--cream)', paddingTop: 110, paddingBottom: 110, position: 'relative', zIndex: 1, overflow: 'hidden' }}>
            <div className="container relative">
              <SectionHeader dark eyebrow="More than a course" title={<>It&rsquo;s a <span className="italic">community</span>, not just a class.</>} />
              <div style={{ marginTop: 64, display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 36 }} className="community-grid">
                {points.map(([t, b], i) => (
                  <Reveal key={i} delay={i * 90}>
                    <div style={{ borderTop: '1px solid rgba(246,242,234,0.22)', paddingTop: 28 }}>
                      <h3 style={{ margin: '0 0 12px', fontWeight: 700, fontSize: 24, letterSpacing: '-0.01em' }} dangerouslySetInnerHTML={{ __html: t }} />
                      <p style={{ margin: 0, fontSize: 16, lineHeight: 1.6, color: 'rgba(246,242,234,0.78)' }} dangerouslySetInnerHTML={{ __html: b }} />
                    </div>
                  </Reveal>
                ))}
              </div>
            </div>
            <div aria-hidden style={{ position: 'absolute', bottom: -60, right: -50, color: 'rgba(246,242,234,0.06)' }}>
              <DandelionO size={1.4} variant="classic" puffStyle="brush" withSeeds={false} whole={true} />
            </div>
          </section>
        );
      }

      // Pricing teaser
      function PriceTeaser() {
        return (
          <section className="section" style={{ paddingTop: 110, paddingBottom: 110 }}>
            <div className="container relative">
              <div className="card" style={{ padding: 'clamp(40px, 5vw, 72px)', display: 'grid', gridTemplateColumns: '1.4fr 1fr', gap: 48, alignItems: 'center', position: 'relative', overflow: 'hidden' }}>
                <div>
                  <div className="eyebrow" style={{ marginBottom: 22 }}>One plan. No tiers. No tricks.</div>
                  <h2 className="display h-lg">
                    <span style={{ fontSize: '1.15em' }}>$37</span><span className="italic" style={{ fontWeight: 400, fontSize: '0.42em', letterSpacing: 0 }}> / month</span>
                  </h2>
                  <p className="lead" style={{ marginTop: 22, maxWidth: 460 }}>
                    Everything in the membership and community, billed month to month. Stay for a season or stay for years, cancel in two clicks, no hard feelings.
                  </p>
                  <div style={{ display: 'flex', gap: 14, marginTop: 32, flexWrap: 'wrap' }}>
                    <a href="https://www.skool.com/honest-digital-for-artists-2113/about" target="_blank" rel="noopener" className="btn btn-clay btn-lg">Start this month →</a>
                    <a href="contact.html" className="btn btn-ghost btn-lg">Ask a question</a>
                  </div>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <DandelionO size={1.2} variant="classic" puffStyle="brush" withSeeds={true} seedCount={6} />
                </div>
              </div>
            </div>
          </section>
        );
      }

      function App() {
        return (
          <div>
            <DriftingSeeds count={14} />
            <Nav active="home" />
            <Hero />
            <Marquee />
            <Promise_ />
            <Foundation />
            <Pillars />
            <Community />
            <PriceTeaser />
            <Footer />
          </div>
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>

    <style>
      .marquee-track { display: inline-flex; white-space: nowrap; animation: marquee 36s linear infinite; }
      @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
      @media (prefers-reduced-motion: reduce) { .marquee-track { animation: none; } }
      @media (max-width: 920px) {
        .container > div[style*="1.5fr 1fr"],
        .container > div[style*="1.4fr 1fr"],
        .community-grid { grid-template-columns: 1fr !important; }
        .pillars-grid, .ways-grid { grid-template-columns: 1fr !important; }
        .problem-row { grid-template-columns: 40px 1fr !important; }
        .problem-row p { grid-column: 2; }
        .footer-grid { grid-template-columns: 1fr 1fr !important; }
      }
      @media (max-width: 640px) {
        .ways-grid { grid-template-columns: 1fr !important; }
